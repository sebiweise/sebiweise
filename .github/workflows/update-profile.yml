name: Update profile SVGs

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC – also picks up a new avatar
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # sharp ships prebuilt binaries as optional packages, so no install
      # scripts are needed – and none from any dependency get to run.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate SVGs
        env:
          # Optional: a fine-grained PAT (read-only, no repo access needed) as
          # PROFILE_STATS_TOKEN. GITHUB_TOKEN works too; private contributions
          # show up as long as "Private contributions" is enabled on the profile.
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node scripts/generate.mjs

      # master is protected (changes only via PR), so the generated SVGs live
      # on their own orphan branch "output" that the README points to.
      - name: Publish to output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd assets
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "chore: update profile SVGs ($(date -u +%F))"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" output
